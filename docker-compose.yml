services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: foodproof
      POSTGRES_PASSWORD: foodproof
      POSTGRES_DB: foodproof
    ports:
      - "5432:5432"
    volumes:
      - foodproof_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  foodproof_pgdata:
